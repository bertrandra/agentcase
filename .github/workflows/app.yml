name: app
# The tools/ scripts and the frozen legacy file are inputs of the browser gates, and docs/ (docs/examples/ included), README.md and CHANGELOG.md are
# read by the suite (docs facts, deviations, portfolio example) and by perf / a11y / e2e-smoke, so a change to any of them runs the workflow too.
# Every run: line below (with its if:, working directory and timeout-minutes) is mirrored, in the same order, by tools/gates.mjs (`cd app && npm run gates` runs them locally; it fails when the two differ).
on:
  pull_request:
    paths: ['app/**', 'tools/**', 'docs/**', 'README.md', 'CHANGELOG.md', 'AgentCase_v*_EN.html', '.github/workflows/app.yml']
  push:
    branches: [main]
    paths: ['app/**', 'tools/**', 'docs/**', 'README.md', 'CHANGELOG.md', 'AgentCase_v*_EN.html', '.github/workflows/app.yml']
permissions:
  contents: read
# A newer push to the same branch or pull request supersedes the run in progress: it is cancelled, the newer commit is checked in full.
concurrency:
  group: app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: xmllint --version || (sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils)   # BPMN XSD validation (D-B7): tests/bpmn fail in CI without it
      - run: npm audit --omit=dev --audit-level=moderate   # the shipped dependencies have no known advisory (uuid is overridden in package.json; GitHub runners have network)
      # Cheap and informative first (seconds each), then the full gate.
      - run: npm run deps:check   # app/src/generated/dependencies.json matches the imports and @calc-zone tags (else: npm run deps:gen)
      - run: npm run dup          # jscpd over the sorted git-tracked sources of src/ and tests/: fails only on NEW duplicated code (baseline app/dup-baseline.json, same numbers locally)
      - run: npm run check   # typecheck + ESLint (150-line rule, layer rules) + graph freshness + the FULL suite (test:affected is a development aid, never the gate)
      - run: npm run build   # one offline HTML file
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: vitest-report
          path: app/test-results/   # JUnit report of the suite (vite.config.ts writes it when CI is set)
          if-no-files-found: ignore
          retention-days: 14
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: check
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
        working-directory: app
      - run: npx playwright install --with-deps chromium
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: node tools/e2e-smoke.mjs     # real Chromium: every section × 6 case fixtures + 2 portfolio files, no console error, no NaN, no CSP violation
      - run: node tools/e2e-flows.mjs     # under the CSP: JSON / HTML snapshot / report / workbooks round trips, Monte Carlo, themes, logo, ?theme= link
      - run: node tools/e2e-bpmn-editor.mjs  # the lazy BPMN editor (B6) under the CSP: offline, watermark visible, one undoable save
      - run: node tools/perf.mjs          # size / shell / edit / undo / section budgets (app/perf-budget.json)
      - run: node tools/parallel-run.mjs  # same files in the legacy app and the TS build: identical headline figures (the 40 workbooks; the 107 case files run nightly)
  # The style and accessibility gates, in parallel with e2e (same start after check) to keep the wall time down. Each tool exits 1 on any unexpected finding.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: check
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
        working-directory: app
      - run: npx playwright install --with-deps chromium
        working-directory: app
      - run: npm run build
        working-directory: app
      # Computed styles of the shell (3 personas) and of the section content against the frozen legacy file: fails on any divergence that is not a
      # recorded exception of app/ui-parity-exceptions.json (or an exception whose pinned value drifted).
      - run: node tools/ui-parity.mjs --shots test-results/ui-parity
        timeout-minutes: 15
      # axe-core on every section and state: fails on any serious / critical violation or a moderate / minor count above app/a11y-budget.json.
      # Each run writes its report under test-results/a11y/ (git-ignored, uploaded below); no report is committed.
      - run: node tools/a11y.mjs --fixtures golden --report test-results/a11y/golden.json --shots test-results/a11y/golden
        if: success() || failure()
        timeout-minutes: 10
      - run: node tools/a11y.mjs --fixtures pf-three-products --report test-results/a11y/pf-three-products.json --shots test-results/a11y/pf-three-products
        if: success() || failure()
        timeout-minutes: 15
      - run: node tools/a11y.mjs --fixtures golden --mode dark --report test-results/a11y/golden-dark.json --shots test-results/a11y/golden-dark
        if: success() || failure()
        timeout-minutes: 10
      - run: node tools/a11y.mjs --fixtures golden --mode dark --contrast high --report test-results/a11y/golden-dark-high.json --shots test-results/a11y/golden-dark-high
        if: success() || failure()
        timeout-minutes: 10
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: a11y-reports
          path: test-results/a11y/*.json
          if-no-files-found: ignore
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-gate-screenshots   # ui-parity: persona and sample section screenshots + divergences.json; a11y: every state with a violation
          path: |
            test-results/ui-parity/
            test-results/a11y/
          if-no-files-found: ignore
          retention-days: 14

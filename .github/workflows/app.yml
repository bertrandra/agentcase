name: app
on:
  pull_request:
    paths: ['app/**', '.github/workflows/app.yml']
  push:
    branches: [main]
    paths: ['app/**']
# A newer push to the same branch or pull request supersedes the run in progress: it is cancelled, the newer commit is checked in full.
concurrency:
  group: app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      # Cheap and informative first (seconds each), then the full gate.
      - run: npm run deps:check   # app/src/generated/dependencies.json matches the imports and @calc-zone tags (else: npm run deps:gen)
      - run: npm run dup          # jscpd over the sorted git-tracked sources of src/ and tests/: fails only on NEW duplicated code (baseline app/dup-baseline.json, same numbers locally)
      - run: npm run check   # typecheck + ESLint (150-line rule, layer rules) + graph freshness + the FULL suite (test:affected is a development aid, never the gate)
      - run: npm run build   # one offline HTML file
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report
          path: app/test-results/   # JUnit report of the suite (vite.config.ts writes it when CI is set)
          if-no-files-found: ignore
          retention-days: 14
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
        working-directory: app
      - run: npx playwright install --with-deps chromium
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: node tools/e2e-smoke.mjs     # real Chromium: every section × 6 case fixtures + 2 portfolio files, no console error, no NaN
      - run: node tools/perf.mjs          # size / shell / edit / undo / section budgets (app/perf-budget.json)
      - run: node tools/parallel-run.mjs  # same files in the legacy app and the TS build: identical headline figures

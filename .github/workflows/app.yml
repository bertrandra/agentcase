name: app
on:
  pull_request:
    paths: ['app/**', '.github/workflows/app.yml']
  push:
    branches: [main]
    paths: ['app/**']
jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run check   # typecheck + ESLint (150-line rule, layer rules) + unit and fixture tests
      - run: npm run build   # one offline HTML file
  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
        working-directory: app
      - run: npx playwright install --with-deps chromium
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: node tools/e2e-smoke.mjs     # real Chromium: 79 sections × 6 fixtures, no console error, no NaN
      - run: node tools/perf.mjs          # size / shell / edit / undo / section budgets (app/perf-budget.json)
      - run: node tools/parallel-run.mjs  # same files in the legacy app and the TS build: identical headline figures
